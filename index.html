<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地素材收藏站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f5f5f5;padding:15px;font-family:system-ui, sans-serif;}
        .top-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
        #search{flex:1;min-width:200px;padding:8px 12px;border:1px solid #ccc;border-radius:4px;outline:none;}
        .btn{padding:8px 16px;border:none;border-radius:4px;background:#2196F3;color:#fff;cursor:pointer;}
        .btn:hover{background:#1976D2;}
        .tag-input{padding:8px;border:1px solid #ccc;border-radius:4px;width:180px;}
        .container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;}
        .item{background:#fff;padding:10px;border-radius:6px;box-shadow:0 2px 4px #ddd;cursor:pointer;}
        .item.selected{border:2px solid #2196F3;}
        .media{width:100%;height:140px;object-fit:cover;border-radius:4px;margin-bottom:8px;}
        .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
        .tag{background:#e3f2fd;padding:2px 6px;border-radius:3px;font-size:12px;color:#1976D2;}
    </style>
</head>
<body>
    <div class="top-bar">
        <input type="text" id="search" placeholder="搜索关键词 或 #标签">
        <input type="text" class="tag-input" id="batchTag" placeholder="批量添加标签">
        <button class="btn" id="addTagBtn">选中项添加标签</button>
    </div>

    <div class="container" id="container"></div>

    <script>
        // 适配你手机的路径
        const VIDEO_BASE = "/storage/emulated/0/本地视频/";
        const IMAGE_BASE = "/storage/emulated/0/本地照片/";

        // 初始化：从本地存储读取数据，或新建
        let mediaList = JSON.parse(localStorage.getItem('mediaData')) || [];
        let selectedList = [];
        const container = document.getElementById('container');
        const searchInput = document.getElementById('search');
        const batchTag = document.getElementById('batchTag');
        const addTagBtn = document.getElementById('addTagBtn');

        // ========== 关键：手动添加素材路径 ==========
        // 你后续新增文件，在这里按格式补充即可
        // 示例：
        // mediaList.push(
        //   { src: IMAGE_BASE + "照片1.jpg", type: "image", tags: [] },
        //   { src: VIDEO_BASE + "视频1.mp4", type: "video", tags: [] }
        // );
        // =========================================

        // 渲染素材列表
        function render(list){
            container.innerHTML = '';
            list.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.id = idx;
                if(selectedList.includes(idx)) div.classList.add('selected');

                let mediaDom = item.type === 'video'
                    ? `<video class="media" controls src="${item.src}"></video>`
                    : `<img class="media" src="${item.src}" alt="">`;

                let tagHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                div.innerHTML = `${mediaDom}<div class="tags">${tagHtml}</div>`;

                // 选中/取消选中（仅本地标记，不影响文件）
                div.onclick = () => {
                    if(selectedList.includes(idx)){
                        selectedList = selectedList.filter(i=>i!==idx);
                        div.classList.remove('selected');
                    }else{
                        selectedList.push(idx);
                        div.classList.add('selected');
                    }
                };
                container.appendChild(div);
            });
        }

        // 保存标签数据到浏览器本地存储（不会修改文件）
        function saveData(){
            localStorage.setItem('mediaData', JSON.stringify(mediaList));
        }

        // 批量添加标签（仅存到本地存储，不修改文件）
        addTagBtn.addEventListener('click', ()=>{
            const tag = batchTag.value.trim();
            if(!tag || selectedList.length === 0) return;
            selectedList.forEach(id=>{
                if(!mediaList[id].tags.includes(tag)){
                    mediaList[id].tags.push(tag);
                }
            });
            saveData();
            render(mediaList);
            batchTag.value = '';
            selectedList = [];
        });

        // 双模式搜索：关键词 / #标签
        searchInput.addEventListener('input', e => {
            const key = e.target.value.trim().toLowerCase();
            if(!key) return render(mediaList);
            let res = [];
            if(key.startsWith('#')){
                const t = key.slice(1);
                res = mediaList.filter(item => item.tags.some(tag=>tag.includes(t)));
            }else{
                res = mediaList.filter(item => 
                    item.src.toLowerCase().includes(key) || item.tags.some(tag=>tag.includes(key))
                );
            }
            render(res);
        });

        // 初始化渲染
        render(mediaList);
    </script>
</body>
</html>
