<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地素材收藏站（带搜索修复版）</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f5f5f5;padding:15px;font-family:system-ui, sans-serif;}
        .top-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
        /* 搜索框高亮显示 */
        #search{flex:1;min-width:200px;padding:12px 15px;border:2px solid #2196F3;border-radius:8px;outline:none;font-size:16px;}
        #search::placeholder{color:#999;}
        .btn{padding:10px 18px;border:none;border-radius:6px;background:#2196F3;color:#fff;cursor:pointer;font-size:15px;}
        .btn:hover{background:#1976D2;}
        .tag-input{padding:10px;border:1px solid #ccc;border-radius:6px;width:180px;font-size:15px;}
        .container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;}
        .item{background:#fff;padding:10px;border-radius:6px;box-shadow:0 2px 4px #ddd;cursor:pointer;}
        .item.selected{border:2px solid #2196F3;}
        .media{width:100%;height:140px;object-fit:cover;border-radius:4px;margin-bottom:8px;}
        .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
        .tag{background:#e3f2fd;padding:2px 6px;border-radius:3px;font-size:12px;color:#1976D2;}
    </style>
</head>
<body>
    <div class="top-bar">
        <!-- 高亮的搜索框，你一眼就能看到 -->
        <input type="text" id="search" placeholder="🔍 输入关键词 或 #标签 搜索">
        <input type="text" class="tag-input" id="batchTag" placeholder="批量添加标签">
        <button class="btn" id="addTagBtn">选中项添加标签</button>
    </div>

    <div class="container" id="container"></div>

    <script>
        // 示例素材（包含你截图里的视频）
        let mediaList = [
            { 
                src: "/storage/emulated/0/本地视频/小女友穿黑丝，.ts.mp4", 
                type: "video", 
                tags: [] 
            }
        ];

        let selectedList = [];
        const container = document.getElementById('container');
        const searchInput = document.getElementById('search');
        const batchTag = document.getElementById('batchTag');
        const addTagBtn = document.getElementById('addTagBtn');

        // 渲染列表
        function render(list){
            container.innerHTML = '';
            if(list.length === 0){
                container.innerHTML = '<p style="color:#999;text-align:center;padding:30px;">暂无素材，可在代码里添加文件路径</p>';
                return;
            }
            list.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.id = idx;
                if(selectedList.includes(idx)) div.classList.add('selected');

                let mediaDom = item.type === 'video'
                    ? `<video class="media" controls src="${item.src}"></video>`
                    : `<img class="media" src="${item.src}" alt="">`;

                let tagHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join('');
                div.innerHTML = `${mediaDom}<div class="tags">${tagHtml}</div>`;

                div.onclick = () => {
                    if(selectedList.includes(idx)){
                        selectedList = selectedList.filter(i=>i!==idx);
                        div.classList.remove('selected');
                    }else{
                        selectedList.push(idx);
                        div.classList.add('selected');
                    }
                };
                container.appendChild(div);
            });
        }

        // 保存标签数据
        function saveData(){
            localStorage.setItem('mediaData', JSON.stringify(mediaList));
        }

        // 批量加标签
        addTagBtn.addEventListener('click', ()=>{
            const tag = batchTag.value.trim();
            if(!tag || selectedList.length === 0) return;
            selectedList.forEach(id=>{
                if(!mediaList[id].tags.includes(tag)){
                    mediaList[id].tags.push(tag);
                }
            });
            saveData();
            render(mediaList);
            batchTag.value = '';
            selectedList = [];
        });

        // 【修复版】搜索功能，实时生效
        searchInput.addEventListener('input', (e) => {
            const key = e.target.value.trim().toLowerCase();
            if(!key){
                // 清空搜索，恢复全部
                render(mediaList);
                return;
            }
            let result = [];
            if(key.startsWith('#')){
                // 标签搜索，支持模糊匹配
                const targetTag = key.slice(1);
                result = mediaList.filter(item => 
                    item.tags.some(tag => tag.toLowerCase().includes(targetTag))
                );
            }else{
                // 关键词搜索，匹配文件名和标签
                result = mediaList.filter(item => 
                    item.src.toLowerCase().includes(key) || 
                    item.tags.some(tag => tag.toLowerCase().includes(key))
                );
            }
            render(result);
        });

        // 初始化加载
        render(mediaList);
    </script>
</body>
</html>
